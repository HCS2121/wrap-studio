<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WrapStudio — Professional Executive Edition (Cloud Sync)</title>
    <!-- Подключаем клиент Supabase для работы с облачной базой -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #0c0e12;
            --bg-card: #141820;
            --bg-hover: #1c222d;
            --border-color: #262d3d;
            --accent: #00f2fe;
            --accent-glow: rgba(0, 242, 254, 0.15);
            --accent-hover: #00c6eb;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger: #ff5c5c;
            --success: #10b981;
            --info: #3b82f6;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 8px 4px;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .container {
            max-width: 1560px;
            margin: 0 auto;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        h1::before {
            content: '';
            display: inline-block;
            width: 5px;
            height: 15px;
            background: var(--accent);
            border-radius: 3px;
            box-shadow: 0 0 8px var(--accent);
        }

        .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; width: 100%; justify-content: space-between; }
        .nav-controls {
            display: flex; align-items: center; gap: 4px;
            background: var(--bg-main); padding: 3px 6px;
            border-radius: 8px; border: 1px solid var(--border-color);
        }
        .nav-label { font-size: 11px; font-weight: 600; padding: 0 2px; min-width: 130px; text-align: center; }

        .btn {
            background-color: var(--accent); color: #0c0e12;
            padding: 8px 12px; font-size: 12px; font-weight: 700;
            border: none; border-radius: 6px; cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); white-space: nowrap;
        }
        .btn:hover { background-color: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 16px var(--accent-glow); }
        .btn-secondary { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: var(--bg-hover); border-color: var(--text-muted); box-shadow: none; }
        .btn-danger {
            background: rgba(255, 92, 92, 0.1); color: var(--danger);
            padding: 4px 6px; font-size: 10px; font-weight: 600;
            border-radius: 4px; border: 1px solid rgba(255, 92, 92, 0.25); cursor: pointer;
        }
        .btn-danger:hover { background: var(--danger); color: #fff; }
        .btn-edit {
            background: rgba(59, 130, 246, 0.1); color: var(--info);
            padding: 4px 6px; font-size: 10px; font-weight: 600;
            border-radius: 4px; border: 1px solid rgba(59, 130, 246, 0.25); cursor: pointer;
        }
        .btn-edit:hover { background: var(--info); color: #fff; }

        /* Анимации и подсветка статусов карточек */
        @keyframes pulseWork {
            0% { box-shadow: 0 0 0 0 rgba(0, 242, 254, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(0, 242, 254, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 242, 254, 0); }
        }

        .bumpix-booking-card {
            position: absolute; top: 2px; left: 2px; right: 2px;
            background: #181f2c; border: 1px solid var(--border-color); border-radius: 6px;
            padding: 4px; font-size: 9px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            display: flex; flex-direction: column; justify-content: space-between;
            cursor: pointer; transition: all 0.2s ease;
        }
        
        /* Стили по статусам */
        .bumpix-booking-card.status-waiting {
            border-left: 3px solid var(--warning);
        }
        .bumpix-booking-card.status-in_progress {
            border-left: 3px solid var(--accent);
            background: rgba(0, 242, 254, 0.05);
            animation: pulseWork 2s infinite;
        }
        .bumpix-booking-card.status-ready {
            border-left: 3px solid var(--success);
            background: rgba(16, 185, 129, 0.05);
            opacity: 0.9;
        }

        .bumpix-card-actions { display: flex; gap: 2px; margin-top: 4px; }

        .bumpix-week-container {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 10px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; width: 100%; overflow-x: auto;
        }
        
        .bumpix-wrapper-inner { width: 100%; display: flex; flex-direction: column; }

        .bumpix-header-row {
            display: grid; grid-template-columns: 50px repeat(7, 1fr);
            border-bottom: 1px solid var(--border-color); background: #10131b;
        }
        .bumpix-time-col-header, .bumpix-time-cell {
            padding: 8px 2px; text-align: center; font-size: 9px; font-weight: 700;
            text-transform: uppercase; color: var(--text-muted); border-right: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: center;
        }
        .bumpix-day-header {
            padding: 8px 2px; text-align: center; font-weight: 600; font-size: 10px;
            border-right: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 2px;
        }
        .bumpix-day-header .day-title { font-size: 10px; font-weight: 700; }
        .bumpix-day-header .day-date { font-size: 9px; color: var(--text-muted); }
        .bumpix-day-header .day-status { font-size: 8px; padding: 1px 3px; border-radius: 3px; margin: 1px auto 0 auto; width: fit-content; font-weight: 600; }
        .status-badge-free { background: rgba(16, 185, 129, 0.12); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-badge-busy { background: rgba(255, 92, 92, 0.12); color: var(--danger); border: 1px solid rgba(255, 92, 92, 0.3); }

        .bumpix-day-header.today {
            background: rgba(0, 242, 254, 0.08); border-bottom: 2px solid var(--accent);
        }
        .bumpix-day-header.today .day-title { color: var(--accent); }

        .bumpix-body { position: relative; overflow-y: auto; max-height: 72vh; }
        .bumpix-row { display: grid; grid-template-columns: 50px repeat(7, 1fr); border-bottom: 1px solid var(--border-color); min-height: 60px; }
        .bumpix-row.lunch-row { background: rgba(255, 92, 92, 0.015); }
        .bumpix-row.lunch-row .bumpix-slot-cell {
            background: repeating-linear-gradient(45deg, rgba(255, 92, 92, 0.02), rgba(255, 92, 92, 0.02) 6px, rgba(255, 92, 92, 0.05) 6px, rgba(255, 92, 92, 0.05) 12px);
            cursor: not-allowed;
        }
        .bumpix-time-cell { background: rgba(0,0,0,0.2); align-items: flex-start; padding-top: 8px; font-size: 9px; }
        .bumpix-slot-cell { border-right: 1px solid var(--border-color); position: relative; cursor: pointer; transition: background 0.2s ease; }
        .bumpix-slot-cell:hover { background: var(--bg-hover); }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 11, 16, 0.85); backdrop-filter: blur(6px);
            justify-content: center; align-items: center; z-index: 1000; padding: 8px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--bg-card); padding: 16px; border-radius: 12px;
            width: 100%; max-width: 500px; border: 1px solid var(--border-color);
            max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 45px rgba(0,0,0,0.7);
        }
        .form-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 4px; font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        input, select {
            width: 100%; padding: 10px; background: var(--bg-main);
            border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main); font-size: 13px; outline: none;
        }
        input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
        .service-category-block { margin-bottom: 8px; border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; background: var(--bg-main); }
        .service-category-title { background: rgba(255,255,255,0.03); padding: 6px 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--accent); border-bottom: 1px solid var(--border-color); }
        .service-items-box { padding: 6px 10px; }
        .bumpix-service-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(38, 45, 61, 0.5); font-size: 12px; gap: 8px; }
        .contact-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid var(--border-color); font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>WrapStudio</h1>
        <div class="header-actions">
            <div style="display: flex; gap: 6px;">
                <button class="btn btn-secondary" style="padding: 6px 10px; font-size: 11px;" onclick="openServicesModal()">⚙ Услуги</button>
                <button class="btn btn-secondary" style="padding: 6px 10px; font-size: 11px;" onclick="openContactsModal()">📖 Контакты</button>
            </div>
            <div class="nav-controls">
                <button class="btn btn-secondary" style="padding: 4px 8px;" onclick="changeWeek(-1)">←</button>
                <span id="weekRangeLabel" class="nav-label">Загрузка...</span>
                <button class="btn btn-secondary" style="padding: 4px 8px;" onclick="changeWeek(1)">→</button>
                <button class="btn" style="padding: 6px 10px; font-size: 11px;" onclick="goToToday()">Сегодня</button>
            </div>
        </div>
    </header>

    <div class="bumpix-week-container">
        <div class="bumpix-wrapper-inner">
            <div id="bumpixHeader" class="bumpix-header-row"></div>
            <div id="bumpixBody" class="bumpix-body"></div>
        </div>
    </div>
</div>

<!-- Модальное окно записи / редактирования -->
<div id="bookingModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle" style="margin-top:0; font-size: 16px; font-weight: 700; margin-bottom: 14px;">Запись</h3>
        <form id="bookingForm">
            <input type="hidden" id="editId">
            
            <div style="display: flex; gap: 8px;">
                <div class="form-group" style="flex:1;">
                    <label>Дата</label>
                    <input type="date" id="formDate" required>
                </div>
                <div class="form-group" style="flex:1;">
                    <label>Время</label>
                    <select id="formTime" required onchange="calculateEndTime()">
                        <option value="09:00">09:00</option>
                        <option value="10:00">10:00</option>
                        <option value="11:00">11:00</option>
                        <option value="12:00">12:00</option>
                        <option value="13:00" disabled style="color:var(--danger); background:rgba(255,92,92,0.15);">13:00 (ОБЕД)</option>
                        <option value="14:00">14:00</option>
                        <option value="15:00">15:00</option>
                        <option value="16:00">16:00</option>
                        <option value="17:00">17:00</option>
                        <option value="18:00">18:00</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Статус</label>
                <select id="formStatus" required>
                    <option value="waiting">⏳ Ожидание</option>
                    <option value="in_progress">⚙️ В работе</option>
                    <option value="ready">✅ Готово</option>
                </select>
            </div>

            <div class="form-group">
                <label>Услуги (выберите количество для каждой):</label>
                <div id="servicesQtyContainer" style="max-height: 160px; overflow-y: auto; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 6px; padding: 6px;"></div>
            </div>

            <div id="timeRangeIndicator" style="background: rgba(0, 242, 254, 0.03); border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; font-size: 12px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px;">
                <div style="display: flex; justify-content: space-between;">
                    <span style="color: var(--text-muted);">Интервал:</span>
                    <strong id="timeRangeDisplay" style="color: var(--accent);">09:00 — 11:00 (2 ч.)</strong>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span style="color: var(--text-muted);">Итого цена:</span>
                    <strong id="totalPriceDisplay" style="color: var(--success);">0 ₽</strong>
                </div>
            </div>

            <div style="display: flex; gap: 8px;">
                <div class="form-group" style="flex:1;">
                    <label>Имя</label>
                    <input type="text" id="formName" required placeholder="Константин">
                </div>
                <div class="form-group" style="flex:1;">
                    <label>Телефон</label>
                    <input type="tel" id="formPhone" required placeholder="+7...">
                </div>
            </div>

            <div class="form-group">
                <label>Автомобиль</label>
                <input type="text" id="formCar" required placeholder="BMW M5">
            </div>

            <div style="display: flex; gap: 8px; margin-top: 14px;">
                <button type="submit" class="btn" style="flex:1; padding: 10px;">Сохранить</button>
                <button type="button" class="btn btn-secondary" style="flex:1; padding: 10px;" onclick="closeModal('bookingModal')">Отмена</button>
            </div>
        </form>
    </div>
</div>

<!-- Модальное окно услуг -->
<div id="servicesModal" class="modal">
    <div class="modal-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 style="margin:0; font-size: 16px; font-weight: 700;">Каталог услуг</h3>
            <button class="btn" style="padding: 6px 10px; font-size: 11px;" onclick="openAddServiceForm()">+ Услуга</button>
        </div>
        <div id="bumpixCategoriesList" style="margin-bottom: 10px; max-height: 280px; overflow-y: auto;"></div>
        <div style="text-align: right;">
            <button type="button" class="btn btn-secondary" style="padding: 8px 12px; width: 100%;" onclick="closeModal('servicesModal')">Закрыть</button>
        </div>
    </div>
</div>

<!-- Модальное окно контактной книги -->
<div id="contactsModal" class="modal">
    <div class="modal-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 style="margin:0; font-size: 16px; font-weight: 700;">Книга контактов</h3>
            <span style="font-size: 11px; color: var(--text-muted);" id="contactsCount">0 клиентов</span>
        </div>
        <div id="contactsListContainer" style="margin-bottom: 10px; max-height: 300px; overflow-y: auto; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 6px;"></div>
        <div>
            <button type="button" class="btn btn-secondary" style="padding: 8px 12px; width: 100%;" onclick="closeModal('contactsModal')">Закрыть</button>
        </div>
    </div>
</div>

<!-- Редактор услуги -->
<div id="serviceEditorModal" class="modal" style="z-index: 1010;">
    <div class="modal-content" style="max-width: 380px;">
        <h3 style="margin-top:0; font-size: 15px; font-weight: 700; margin-bottom: 12px;">Добавить услугу</h3>
        <form id="addServiceForm">
            <div class="form-group">
                <label>Категория</label>
                <select id="newServiceGroup" required>
                    <option value="Тонировка">Тонировка</option>
                    <option value="Атермалка">Атермалка</option>
                    <option value="Хамелеон">Хамелеон</option>
                    <option value="Бронь">Бронь</option>
                </select>
            </div>
            <div class="form-group">
                <label>Название</label>
                <input type="text" id="newServiceName" required placeholder="Задняя полусфера">
            </div>
            <div style="display: flex; gap: 8px;">
                <div class="form-group" style="flex:1;">
                    <label>Цена (₽)</label>
                    <input type="number" id="newServicePrice" required placeholder="8000">
                </div>
                <div class="form-group" style="flex:1;">
                    <label>Часов</label>
                    <input type="number" step="0.5" id="newServiceDurationNum" required placeholder="2">
                </div>
            </div>
            <div style="display: flex; gap: 8px; margin-top: 14px;">
                <button type="submit" class="btn" style="flex:1; padding: 10px;">Сохранить</button>
                <button type="button" class="btn btn-secondary" style="flex:1; padding: 10px;" onclick="closeModal('serviceEditorModal')">Отмена</button>
            </div>
        </form>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://owgzxojhutyotirszqoz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_p_fBVPC_RpIZF7LeLAy-Rw_gkacIzzk';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let defaultServices = [
        { group: "Тонировка", name: "Тонировка стандарт", price: 8000, durationNum: 2, duration: "2 часа" },
        { group: "Атермалка", name: "Атермальная пленка лбом", price: 6000, durationNum: 1.5, duration: "1.5 часа" },
        { group: "Хамелеон", name: "Хамелеон лобовое", price: 14000, durationNum: 3, duration: "3 часа" },
        { group: "Бронь", name: "Защита кузова (комплект)", price: 45000, durationNum: 5, duration: "5 часов" }
    ];

    let services = JSON.parse(localStorage.getItem('wrap_services')) || defaultServices;
    let bookings = {}; 
    let currentWeekDate = new Date();

    const categories = ["Тонировка", "Атермалка", "Хамелеон", "Бронь"];
    const daysNames = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
    const hoursRange = ["09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00"];
    const monthsNames = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];

    function getMonday(d) {
        d = new Date(d);
        let day = d.getDay();
        let diff = d.getDate() - day + (day === 0 ? -6 : 1);
        return new Date(d.setDate(diff));
    }

    async function fetchBookings() {
        let monday = getMonday(currentWeekDate);
        let sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);

        let startStr = monday.toISOString().split('T')[0];
        let endStr = sunday.toISOString().split('T')[0];

        const { data, error } = await supabaseClient
            .from('bookings')
            .select('*')
            .gte('date', startStr)
            .lte('date', endStr);

        if (error) {
            console.error('Ошибка загрузки:', error);
            return;
        }

        bookings = {};
        if (data) {
            data.forEach(item => {
                if (!bookings[item.date]) bookings[item.date] = [];
                bookings[item.date].push({
                    id: item.id,
                    date: item.date,
                    time: item.time,
                    timeRange: item.time_range,
                    durationNum: item.duration_num,
                    services: item.services, // Массив объектов {name, price, qty, duration} или строк
                    status: item.status || 'waiting',
                    name: item.client_name,
                    phone: item.phone,
                    car: item.car
                });
            });
        }

        renderBumpixWeekCalendar();
    }

    function checkDayHalves(dayBookings) {
        let morningHours = ["09:00", "10:00", "11:00", "12:00"];
        let eveningHours = ["14:00", "15:00", "16:00", "17:00", "18:00"];
        let isMorningBusy = morningHours.some(h => dayBookings.some(b => b.time === h));
        let isEveningBusy = eveningHours.some(h => dayBookings.some(b => b.time === h));
        return { isMorningBusy, isEveningBusy, isFullyBusy: isMorningBusy && isEveningBusy };
    }

    function renderBumpixWeekCalendar() {
        const headerEl = document.getElementById('bumpixHeader');
        const bodyEl = document.getElementById('bumpixBody');
        
        let monday = getMonday(currentWeekDate);
        let sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);

        document.getElementById('weekRangeLabel').innerText = 
            `${monday.getDate()} ${monthsNames[monday.getMonth()]} — ${sunday.getDate()} ${monthsNames[sunday.getMonth()]}`;

        const todayStr = new Date().toISOString().split('T')[0];
        let headerHtml = `<div class="bumpix-time-col-header">Время</div>`;
        let weekDates = [];

        for (let i = 0; i < 7; i++) {
            let currentDay = new Date(monday);
            currentDay.setDate(monday.getDate() + i);
            let dateStr = currentDay.toISOString().split('T')[0];
            weekDates.push(dateStr);

            let isToday = (dateStr === todayStr);
            let dayBookings = bookings[dateStr] || [];
            let halves = checkDayHalves(dayBookings);
            let statusBadge = !halves.isFullyBusy 
                ? `<div class="day-status status-badge-free">Своб.</div>` 
                : `<div class="day-status status-badge-busy">Занят</div>`;

            headerHtml += `
                <div class="bumpix-day-header ${isToday ? 'today' : ''}">
                    <div class="day-title">${daysNames[i]}</div>
                    <div class="day-date">${currentDay.getDate()} ${monthsNames[currentDay.getMonth()]}</div>
                    ${statusBadge}
                </div>
            `;
        }
        headerEl.innerHTML = headerHtml;

        let bodyHtml = '';
        hoursRange.forEach(hour => {
            let isLunch = (hour === "13:00");
            bodyHtml += `<div class="bumpix-row ${isLunch ? 'lunch-row' : ''}">`;
            bodyHtml += isLunch ? `<div class="bumpix-time-cell" style="color:var(--danger);">13:00 ☕</div>` : `<div class="bumpix-time-cell">${hour}</div>`;

            weekDates.forEach(dateStr => {
                if (isLunch) {
                    bodyHtml += `<div class="bumpix-slot-cell" onclick="alert('Обед (13:00 - 14:00)')"></div>`;
                } else {
                    bodyHtml += `<div class="bumpix-slot-cell" onclick="onSlotClick('${dateStr}', '${hour}')">`;
                    
                    let dayBookings = bookings[dateStr] || [];
                    dayBookings.forEach((b) => {
                        if (b.time === hour) {
                            let durationHours = b.durationNum || 2;
                            let cardHeight = (durationHours * 60) - 4;
                            let statusClass = `status-${b.status || 'waiting'}`;
                            
                            bodyHtml += `
                                <div class="bumpix-booking-card ${statusClass}" style="height: ${cardHeight}px; z-index: ${Math.round(durationHours * 10)};" onclick="openEditModal('${b.id}')">
                                    <div>
                                        <div style="display:flex; justify-content:space-between; align-items:center;">
                                            <span style="font-weight:700; color:var(--accent); font-size:8px;">${b.timeRange || b.time}</span>
                                            <span style="font-size:8px; font-weight:700; text-transform:uppercase; color:var(--text-muted);">
                                                ${b.status === 'in_progress' ? '⚙️ В работе' : (b.status === 'ready' ? '✅ Готово' : '⏳ Ожидание')}
                                            </span>
                                        </div>
                                        <div style="font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${b.name}</div>
                                        <div style="color:var(--text-muted); font-size:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${b.car}</div>
                                    </div>
                                    <div class="bumpix-card-actions" onclick="event.stopPropagation()">
                                        <button class="btn-edit" onclick="openEditModal('${b.id}')">Изм</button>
                                        <button class="btn-danger" onclick="deleteBooking('${b.id}')">Уд</button>
                                    </div>
                                </div>
                            `;
                        }
                    });
                    bodyHtml += `</div>`;
                }
            });
            bodyHtml += `</div>`;
        });
        bodyEl.innerHTML = bodyHtml;
    }

    function changeWeek(dir) {
        currentWeekDate.setDate(currentWeekDate.getDate() + (dir * 7));
        fetchBookings();
    }

    function goToToday() {
        currentWeekDate = new Date();
        fetchBookings();
    }

    // Инициализация чекбоксов с количеством (можно выбирать одну услугу несколько раз)
    function updateServicesQtyContainer(selectedServicesMap = {}) {
        const container = document.getElementById('servicesQtyContainer');
        container.innerHTML = '';

        categories.forEach(cat => {
            let catServices = services.filter(s => s.group === cat);
            if (catServices.length === 0) return;

            let catBlock = document.createElement('div');
            catBlock.className = 'service-category-block';
            catBlock.innerHTML = `<div class="service-category-title">${cat}</div>`;
            
            let itemsBox = document.createElement('div');
            itemsBox.className = 'service-items-box';

            catServices.forEach(s => {
                let currentQty = selectedServicesMap[s.name] || 0;
                itemsBox.innerHTML += `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:11px;">
                        <span>${s.name} (${s.price.toLocaleString()} ₽)</span>
                        <div style="display:flex; align-items:center; gap:6px;">
                            <span style="font-size:10px; color:var(--text-muted);">${s.durationNum || 2}ч</span>
                            <input type="number" min="0" max="10" value="${currentQty}" 
                                data-name="${s.name}" 
                                data-price="${s.price}" 
                                data-duration="${s.durationNum || 2}" 
                                class="service-qty-input" 
                                style="width: 50px; padding: 4px; text-align: center;" 
                                onchange="calculateEndTime()">
                        </div>
                    </div>
                `;
            });
            catBlock.appendChild(itemsBox);
            container.appendChild(catBlock);
        });
        calculateEndTime();
    }

    function calculateEndTime() {
        const timeSelect = document.getElementById('formTime');
        const qtyInputs = document.querySelectorAll('.service-qty-input');
        let totalDuration = 0, totalPrice = 0;

        qtyInputs.forEach(input => {
            let qty = parseInt(input.value) || 0;
            if (qty > 0) {
                totalDuration += (parseFloat(input.getAttribute('data-duration')) || 0) * qty;
                totalPrice += (parseFloat(input.getAttribute('data-price')) || 0) * qty;
            }
        });

        if (totalDuration === 0) totalDuration = 2;

        let [h, m] = timeSelect.value.split(':').map(Number);
        let endM = h * 60 + m + totalDuration * 60;
        let endHStr = `${String(Math.floor(endM / 60)).padStart(2, '0')}:${String(endM % 60).padStart(2, '0')}`;

        document.getElementById('timeRangeDisplay').textContent = `${timeSelect.value} — ${endHStr} (${totalDuration} ч.)`;
        document.getElementById('totalPriceDisplay').textContent = `${totalPrice.toLocaleString()} ₽`;
    }

    function onSlotClick(dateStr, timeStr) {
        document.getElementById('modalTitle').innerText = 'Новая запись';
        document.getElementById('bookingForm').reset();
        document.getElementById('editId').value = '';
        document.getElementById('formDate').value = dateStr;
        document.getElementById('formTime').value = timeStr;
        document.getElementById('formStatus').value = 'waiting';
        updateServicesQtyContainer({});
        openModal('bookingModal');
    }

    function openEditModal(id) {
        document.getElementById('modalTitle').innerText = 'Редактировать запись';
        let foundBooking = null;
        for (let date in bookings) {
            let match = bookings[date].find(b => b.id === id);
            if (match) { foundBooking = match; break; }
        }
        if (!foundBooking) return;

        document.getElementById('editId').value = foundBooking.id;
        document.getElementById('formDate').value = foundBooking.date;
        document.getElementById('formTime').value = foundBooking.time;
        document.getElementById('formStatus').value = foundBooking.status || 'waiting';
        document.getElementById('formName').value = foundBooking.name;
        document.getElementById('formPhone').value = foundBooking.phone;
        document.getElementById('formCar').value = foundBooking.car;

        // Превращаем массив сохраненных услуг обратно в карту количества
        let servicesMap = {};
        if (Array.isArray(foundBooking.services)) {
            foundBooking.services.forEach(item => {
                if (typeof item === 'object' && item.name) {
                    servicesMap[item.name] = item.qty || 1;
                } else if (typeof item === 'string') {
                    servicesMap[item] = (servicesMap[item] || 0) + 1;
                }
            });
        }

        updateServicesQtyContainer(servicesMap);
        openModal('bookingModal');
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    // Контакты
    async function openContactsModal() {
        const container = document.getElementById('contactsListContainer');
        container.innerHTML = '<div style="padding: 12px; text-align: center; color: var(--text-muted);">Загрузка...</div>';
        openModal('contactsModal');

        const { data, error } = await supabaseClient
            .from('bookings')
            .select('client_name, phone, car, date')
            .order('date', { ascending: false });

        if (error) {
            container.innerHTML = '<div style="padding: 12px; text-align: center; color: var(--danger);">Ошибка загрузки</div>';
            return;
        }

        let uniqueMap = new Map();
        (data || []).forEach(item => {
            if (item.phone && !uniqueMap.has(item.phone)) {
                uniqueMap.set(item.phone, item);
            }
        });

        document.getElementById('contactsCount').innerText = `${uniqueMap.size} клиентов`;
        container.innerHTML = '';

        if (uniqueMap.size === 0) {
            container.innerHTML = '<div style="padding: 12px; text-align: center; color: var(--text-muted);">Контактов пока нет</div>';
            return;
        }

        uniqueMap.forEach((client) => {
            container.innerHTML += `
                <div class="contact-item">
                    <div>
                        <strong>${client.client_name}</strong><br>
                        <span style="color: var(--text-muted); font-size: 10px;">🚗 ${client.car || 'Не указано'}</span>
                    </div>
                    <div>
                        <a href="tel:${client.phone}" class="btn-edit" style="text-decoration: none; padding: 6px 8px;">📞 ${client.phone}</a>
                    </div>
                </div>
            `;
        });
    }

    document.getElementById('bookingForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const qtyInputs = document.querySelectorAll('.service-qty-input');
        let selectedServicesList = [];
        let totalDuration = 0;

        qtyInputs.forEach(input => {
            let qty = parseInt(input.value) || 0;
            if (qty > 0) {
                let name = input.getAttribute('data-name');
                let price = parseFloat(input.getAttribute('data-price')) || 0;
                let dur = parseFloat(input.getAttribute('data-duration')) || 2;
                selectedServicesList.push({ name, price, qty, duration: dur });
                totalDuration += dur * qty;
            }
        });

        if (selectedServicesList.length === 0) { alert('Выберите хотя бы одну услугу.'); return; }

        let dateStr = document.getElementById('formDate').value;
        let timeStr = document.getElementById('formTime').value;
        let statusStr = document.getElementById('formStatus').value;

        let [h, m] = timeStr.split(':').map(Number);
        let endM = h * 60 + m + totalDuration * 60;
        let endHStr = `${String(Math.floor(endM / 60)).padStart(2, '0')}:${String(endM % 60).padStart(2, '0')}`;

        const entry = {
            date: dateStr,
            time: timeStr,
            time_range: `${timeStr} — ${endHStr}`,
            duration_num: totalDuration,
            services: selectedServicesList,
            status: statusStr,
            client_name: document.getElementById('formName').value,
            phone: document.getElementById('formPhone').value,
            car: document.getElementById('formCar').value
        };

        let editId = document.getElementById('editId').value;

        if (editId) {
            let { error } = await supabaseClient.from('bookings').update(entry).eq('id', editId);
            if (error) { alert('Ошибка: ' + error.message); return; }
        } else {
            let { error } = await supabaseClient.from('bookings').insert([entry]);
            if (error) { alert('Ошибка: ' + error.message); return; }
        }

        closeModal('bookingModal');
        fetchBookings();
    });

    async function deleteBooking(id) {
        if (confirm('Вы уверены, что хотите удалить эту запись?')) {
            let { error } = await supabaseClient.from('bookings').delete().eq('id', id);
            if (error) { alert('Ошибка: ' + error.message); return; }
            fetchBookings();
        }
    }

    function openServicesModal() { renderBumpixCategories(); openModal('servicesModal'); }
    function renderBumpixCategories() {
        const container = document.getElementById('bumpixCategoriesList');
        container.innerHTML = '';
        categories.forEach(cat => {
            let catServices = services.filter(s => s.group === cat);
            let catBlock = document.createElement('div');
            catBlock.className = 'service-category-block';
            catBlock.innerHTML = `<div class="service-category-title">${cat}</div>`;
            let itemsBox = document.createElement('div');
            itemsBox.className = 'service-items-box';
            catServices.forEach((s) => {
                let idx = services.indexOf(s);
                itemsBox.innerHTML += `
                    <div class="bumpix-service-item">
                        <div><strong>${s.name}</strong><br><span style="font-size:10px; color:var(--text-muted);">${s.price.toLocaleString()} ₽ (${s.durationNum || 2} ч.)</span></div>
                        <button class="btn-danger" onclick="deleteService(${idx})">Уд.</button>
                    </div>`;
            });
            catBlock.appendChild(itemsBox);
            container.appendChild(catBlock);
        });
    }

    function openAddServiceForm() { document.getElementById('addServiceForm').reset(); openModal('serviceEditorModal'); }
    document.getElementById('addServiceForm').addEventListener('submit', function(e) {
        e.preventDefault();
        let dur = parseFloat(document.getElementById('newServiceDurationNum').value) || 2;
        services.push({
            group: document.getElementById('newServiceGroup').value,
            name: document.getElementById('newServiceName').value,
            price: Number(document.getElementById('newServicePrice').value),
            durationNum: dur,
            duration: `${dur} ч.`
        });
        localStorage.setItem('wrap_services', JSON.stringify(services));
        closeModal('serviceEditorModal');
        renderBumpixCategories();
    });

    function deleteService(idx) {
        services.splice(idx, 1);
        localStorage.setItem('wrap_services', JSON.stringify(services));
        renderBumpixCategories();
    }

    fetchBookings();
</script>

</body>
</html>
