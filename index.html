<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WrapStudio — Professional Executive Edition</title>
    <style>
        :root {
            --bg-main: #0c0e12;
            --bg-card: #141820;
            --bg-hover: #1c222d;
            --border-color: #262d3d;
            --accent: #00f2fe;
            --accent-glow: rgba(0, 242, 254, 0.15);
            --accent-hover: #00c6eb;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger: #ff5c5c;
            --success: #10b981;
            --info: #3b82f6;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 30px 20px;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .container {
            max-width: 1560px;
            margin: 0 auto;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            padding: 20px 28px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        h1::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 20px;
            background: var(--accent);
            border-radius: 4px;
            box-shadow: 0 0 12px var(--accent);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-main);
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .nav-label {
            font-size: 14px;
            font-weight: 600;
            padding: 0 8px;
            min-width: 190px;
            text-align: center;
        }

        .btn {
            background-color: var(--accent);
            color: #0c0e12;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
        }
        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .btn:active { transform: translateY(0); }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover {
            background: var(--bg-hover);
            border-color: var(--text-muted);
            box-shadow: none;
        }

        .btn-danger {
            background: rgba(255, 92, 92, 0.1);
            color: var(--danger);
            padding: 5px 10px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 6px;
            border: 1px solid rgba(255, 92, 92, 0.25);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-danger:hover { background: var(--danger); color: #fff; }

        .btn-edit {
            background: rgba(59, 130, 246, 0.1);
            color: var(--info);
            padding: 5px 10px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 6px;
            border: 1px solid rgba(59, 130, 246, 0.25);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-edit:hover { background: var(--info); color: #fff; }

        /* Сетка календаря */
        .bumpix-week-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 12px 36px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
        }

        .bumpix-header-row {
            display: grid;
            grid-template-columns: 90px repeat(7, minmax(150px, 1fr));
            border-bottom: 1px solid var(--border-color);
            background: #10131b;
        }

        .bumpix-time-col-header {
            padding: 16px 8px;
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            border-right: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bumpix-day-header {
            padding: 14px 10px;
            text-align: center;
            font-weight: 600;
            font-size: 13px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .bumpix-day-header .day-title {
            font-size: 13px;
            font-weight: 700;
        }
        .bumpix-day-header .day-date {
            font-size: 11px;
            color: var(--text-muted);
        }
        .bumpix-day-header .day-status {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            margin: 2px auto 0 auto;
            width: fit-content;
            font-weight: 600;
        }
        .status-badge-free {
            background: rgba(16, 185, 129, 0.12);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .status-badge-busy {
            background: rgba(255, 92, 92, 0.12);
            color: var(--danger);
            border: 1px solid rgba(255, 92, 92, 0.3);
        }

        /* Пульсирующая анимация сегодняшнего дня */
        .bumpix-day-header.today {
            background: rgba(0, 242, 254, 0.08);
            border-bottom: 2px solid var(--accent);
            animation: todayPulse 2.5s infinite ease-in-out;
        }
        .bumpix-day-header.today .day-title {
            color: var(--accent);
        }

        @keyframes todayPulse {
            0% { box-shadow: inset 0 0 0 0 rgba(0, 242, 254, 0); }
            50% { box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.12); }
            100% { box-shadow: inset 0 0 0 0 rgba(0, 242, 254, 0); }
        }

        .bumpix-body {
            position: relative;
            overflow-y: auto;
            max-height: 72vh;
        }

        .bumpix-row {
            display: grid;
            grid-template-columns: 90px repeat(7, minmax(150px, 1fr));
            border-bottom: 1px solid var(--border-color);
            min-height: 75px;
        }

        .bumpix-row.lunch-row {
            background: rgba(255, 92, 92, 0.015);
        }
        .bumpix-row.lunch-row .bumpix-slot-cell {
            background: repeating-linear-gradient(45deg, rgba(255, 92, 92, 0.02), rgba(255, 92, 92, 0.02) 10px, rgba(255, 92, 92, 0.05) 10px, rgba(255, 92, 92, 0.05) 20px);
            cursor: not-allowed;
        }

        .bumpix-time-cell {
            padding: 12px 8px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            border-right: 1px solid var(--border-color);
            background: rgba(0,0,0,0.2);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 14px;
        }

        .bumpix-slot-cell {
            border-right: 1px solid var(--border-color);
            position: relative;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .bumpix-slot-cell:hover {
            background: var(--bg-hover);
        }

        .bumpix-booking-card {
            position: absolute;
            top: 4px; left: 5px; right: 5px;
            background: #181f2c;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            font-size: 11px;
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
            border-left: 3px solid var(--accent);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            animation: cardScaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .bumpix-booking-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(0,0,0,0.6);
            z-index: 100 !important;
        }

        @keyframes cardScaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .bumpix-card-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 11, 16, 0.8);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--bg-card);
            padding: 32px;
            border-radius: 16px;
            width: 100%;
            max-width: 580px;
            border: 1px solid var(--border-color);
            max-height: 90vh;
            overflow-y: auto;
            box-sizing: border-box;
            box-shadow: 0 20px 45px rgba(0,0,0,0.7);
            transform: scale(0.95);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal.active .modal-content {
            transform: scale(1);
        }

        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; }
        input, select {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s ease;
        }
        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .service-category-block {
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background: var(--bg-main);
        }
        .service-category-title {
            background: rgba(255,255,255,0.03);
            padding: 10px 14px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent);
            border-bottom: 1px solid var(--border-color);
        }
        .service-items-box { padding: 10px 14px; }

        .bumpix-service-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(38, 45, 61, 0.5);
            font-size: 13px;
        }
        .bumpix-service-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>WrapStudio Management</h1>
        <div class="header-actions">
            <button class="btn btn-secondary" onclick="openServicesModal()">⚙ Каталог услуг</button>
            <div class="nav-controls">
                <button class="btn btn-secondary" style="padding: 6px 12px;" onclick="changeWeek(-1)">←</button>
                <span id="weekRangeLabel" class="nav-label"></span>
                <button class="btn btn-secondary" style="padding: 6px 12px;" onclick="changeWeek(1)">→</button>
                <button class="btn" style="padding: 8px 14px; font-size: 12px;" onclick="goToToday()">Сегодня</button>
            </div>
        </div>
    </header>

    <!-- Сетка -->
    <div class="bumpix-week-container">
        <div id="bumpixHeader" class="bumpix-header-row"></div>
        <div id="bumpixBody" class="bumpix-body"></div>
    </div>
</div>

<!-- Окно записи -->
<div id="bookingModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle" style="margin-top:0; font-size: 18px; font-weight: 700; color: var(--text-main); margin-bottom: 22px;">Новая запись</h3>
        <form id="bookingForm">
            <input type="hidden" id="editIndex">
            <input type="hidden" id="targetDate">
            
            <div style="display: flex; gap: 14px;">
                <div class="form-group" style="flex:1;">
                    <label>Дата</label>
                    <input type="date" id="formDate" required>
                </div>
                <div class="form-group" style="flex:1;">
                    <label>Время начала</label>
                    <select id="formTime" required onchange="calculateEndTime()">
                        <option value="09:00">09:00</option>
                        <option value="10:00">10:00</option>
                        <option value="11:00">11:00</option>
                        <option value="12:00">12:00</option>
                        <option value="13:00" disabled style="color:var(--danger); background:rgba(255,92,92,0.15);">13:00 — 14:00 (ОБЕД ❌)</option>
                        <option value="14:00">14:00</option>
                        <option value="15:00">15:00</option>
                        <option value="16:00">16:00</option>
                        <option value="17:00">17:00</option>
                        <option value="18:00">18:00 (Конец работы)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Услуги по категориям:</label>
                <div id="servicesCheckboxesContainer" style="max-height: 220px; overflow-y: auto; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 8px; padding: 8px;"></div>
            </div>

            <div id="timeRangeIndicator" style="background: rgba(0, 242, 254, 0.03); border: 1px solid var(--border-color); padding: 14px; border-radius: 8px; font-size: 13px; margin-bottom: 18px; display: flex; flex-direction: column; gap: 8px;">
                <div style="display: flex; justify-content: space-between;">
                    <span style="color: var(--text-muted);">Интервал:</span>
                    <strong id="timeRangeDisplay" style="color: var(--accent);">09:00 — 11:00 (2 часа)</strong>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span style="color: var(--text-muted);">Итого цена:</span>
                    <strong id="totalPriceDisplay" style="color: var(--success);">0 ₽</strong>
                </div>
            </div>

            <div style="display: flex; gap: 14px;">
                <div class="form-group" style="flex:1;">
                    <label>Имя клиента</label>
                    <input type="text" id="formName" required placeholder="Константин">
                </div>
                <div class="form-group" style="flex:1;">
                    <label>Телефон</label>
                    <input type="tel" id="formPhone" required placeholder="+7 (999) 000-00-00">
                </div>
            </div>

            <div class="form-group">
                <label>Автомобиль</label>
                <input type="text" id="formCar" required placeholder="BMW M5">
            </div>

            <div style="display: flex; gap: 12px; margin-top: 26px;">
                <button type="submit" class="btn" style="flex:1; padding: 12px;">Сохранить запись</button>
                <button type="button" class="btn btn-secondary" style="flex:1; padding: 12px;" onclick="closeModal('bookingModal')">Отмена</button>
            </div>
        </form>
    </div>
</div>

<!-- Окно услуг -->
<div id="servicesModal" class="modal">
    <div class="modal-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="margin:0; font-size: 18px; font-weight: 700; color: var(--text-main);">Каталог услуг</h3>
            <button class="btn" style="padding: 8px 14px; font-size: 12px;" onclick="openAddServiceForm()">+ Услуга</button>
        </div>
        <div id="bumpixCategoriesList" style="margin-bottom: 20px; max-height: 380px; overflow-y: auto;"></div>
        <div style="text-align: right;">
            <button type="button" class="btn btn-secondary" style="padding: 10px 18px;" onclick="closeModal('servicesModal')">Закрыть</button>
        </div>
    </div>
</div>

<!-- Редактор услуги -->
<div id="serviceEditorModal" class="modal" style="z-index: 1010;">
    <div class="modal-content" style="max-width: 420px;">
        <h3 id="serviceEditorTitle" style="margin-top:0; font-size: 16px; font-weight: 700; color: var(--text-main); margin-bottom: 18px;">Добавить услугу</h3>
        <form id="addServiceForm">
            <div class="form-group">
                <label>Категория</label>
                <select id="newServiceGroup" required>
                    <option value="Тонировка">Тонировка</option>
                    <option value="Атермалка">Атермалка</option>
                    <option value="Хамелеон">Хамелеон</option>
                    <option value="Бронь">Бронь</option>
                </select>
            </div>
            <div class="form-group">
                <label>Название</label>
                <input type="text" id="newServiceName" required placeholder="Задняя полусфера">
            </div>
            <div style="display: flex; gap: 14px;">
                <div class="form-group" style="flex:1;">
                    <label>Цена (₽)</label>
                    <input type="number" id="newServicePrice" required placeholder="8000">
                </div>
                <div class="form-group" style="flex:1;">
                    <label>Часов</label>
                    <input type="number" step="0.5" id="newServiceDurationNum" required placeholder="2" oninput="syncDurationText()">
                    <input type="hidden" id="newServiceDuration">
                </div>
            </div>
            <div style="display: flex; gap: 12px; margin-top: 22px;">
                <button type="submit" class="btn" style="flex:1; padding: 11px;">Сохранить</button>
                <button type="button" class="btn btn-secondary" style="flex:1; padding: 11px;" onclick="closeModal('serviceEditorModal')">Отмена</button>
            </div>
        </form>
    </div>
</div>

<script>
    let defaultServices = [
        { group: "Тонировка", name: "Тонировка стандарт", price: 8000, durationNum: 2, duration: "2 часа" },
        { group: "Атермалка", name: "Атермальная пленка лбом", price: 6000, durationNum: 1.5, duration: "1.5 часа" },
        { group: "Хамелеон", name: "Хамелеон лобовое", price: 14000, durationNum: 3, duration: "3 часа" },
        { group: "Бронь", name: "Защита кузова (комплект)", price: 45000, durationNum: 5, duration: "5 часов" }
    ];

    let services = JSON.parse(localStorage.getItem('wrap_services')) || defaultServices;
    let bookings = JSON.parse(localStorage.getItem('wrap_week_bumpix_bookings')) || {};
    let currentWeekDate = new Date();

    const categories = ["Тонировка", "Атермалка", "Хамелеон", "Бронь"];
    const daysNames = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
    const hoursRange = ["09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00"];
    const monthsNames = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];

    function getMonday(d) {
        d = new Date(d);
        let day = d.getDay();
        let diff = d.getDate() - day + (day === 0 ? -6 : 1);
        return new Date(d.setDate(diff));
    }

    // Проверка занятости половины дня: утро (09:00-13:00) или вечер (14:00-18:00)
    function checkDayHalves(dayBookings) {
        let morningHours = ["09:00", "10:00", "11:00", "12:00"];
        let eveningHours = ["14:00", "15:00", "16:00", "17:00", "18:00"];

        let isMorningBusy = morningHours.some(h => dayBookings.some(b => b.time === h));
        let isEveningBusy = eveningHours.some(h => dayBookings.some(b => b.time === h));

        return { isMorningBusy, isEveningBusy, isFullyBusy: isMorningBusy && isEveningBusy };
    }

    function renderBumpixWeekCalendar() {
        const headerEl = document.getElementById('bumpixHeader');
        const bodyEl = document.getElementById('bumpixBody');
        
        let monday = getMonday(currentWeekDate);
        let sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);

        document.getElementById('weekRangeLabel').innerText = 
            `${monday.getDate()} ${monthsNames[monday.getMonth()]} — ${sunday.getDate()} ${monthsNames[sunday.getMonth()]} ${sunday.getFullYear()}`;

        const todayStr = new Date().toISOString().split('T')[0];

        let headerHtml = `<div class="bumpix-time-col-header">Время</div>`;
        let weekDates = [];

        for (let i = 0; i < 7; i++) {
            let currentDay = new Date(monday);
            currentDay.setDate(monday.getDate() + i);
            let dateStr = currentDay.toISOString().split('T')[0];
            weekDates.push(dateStr);

            let isToday = (dateStr === todayStr);
            let dayBookings = bookings[dateStr] || [];
            let halves = checkDayHalves(dayBookings);
            
            let statusBadge = '';
            if (!halves.isFullyBusy) {
                statusBadge = `<div class="day-status status-badge-free">Свободно</div>`;
            } else {
                statusBadge = `<div class="day-status status-badge-busy">Занято</div>`;
            }

            headerHtml += `
                <div class="bumpix-day-header ${isToday ? 'today' : ''}">
                    <div class="day-title">${daysNames[i]}</div>
                    <div class="day-date">${currentDay.getDate()} ${monthsNames[currentDay.getMonth()]}</div>
                    ${statusBadge}
                </div>
            `;
        }
        headerEl.innerHTML = headerHtml;

        let bodyHtml = '';
        hoursRange.forEach(hour => {
            let isLunch = (hour === "13:00");
            bodyHtml += `<div class="bumpix-row ${isLunch ? 'lunch-row' : ''}">`;
            
            if (isLunch) {
                bodyHtml += `<div class="bumpix-time-cell" style="color:var(--danger); font-weight:700;">13:00 ☕</div>`;
            } else {
                bodyHtml += `<div class="bumpix-time-cell">${hour}</div>`;
            }

            weekDates.forEach(dateStr => {
                if (isLunch) {
                    bodyHtml += `<div class="bumpix-slot-cell" onclick="alert('С 13:00 до 14:00 у мастера обед. Запись в это время невозможна.')" title="Обед (13:00 - 14:00)"></div>`;
                } else {
                    bodyHtml += `<div class="bumpix-slot-cell" onclick="onSlotClick('${dateStr}', '${hour}')">`;
                    
                    let dayBookings = bookings[dateStr] || [];
                    dayBookings.forEach((b, bIdx) => {
                        if (b.time === hour) {
                            let servicesStr = b.services ? b.services.join(', ') : b.service;
                            let durationHours = b.durationNum || 2;
                            let cardHeight = (durationHours * 75) - 8;
                            
                            bodyHtml += `
                                <div class="bumpix-booking-card" style="height: ${cardHeight}px; z-index: ${Math.round(durationHours * 10)};" onclick="event.stopPropagation()">
                                    <div>
                                        <div style="font-weight:700; color:var(--accent); margin-bottom:3px;">${b.timeRange || b.time}</div>
                                        <div style="font-weight:700; color:var(--text-main);">${b.name}</div>
                                        <div style="color:var(--text-muted);">${b.car}</div>
                                        <div style="font-size:10px; color:var(--success); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">🛠 ${servicesStr}</div>
                                    </div>
                                    <div class="bumpix-card-actions">
                                        <button class="btn-edit" onclick="openEditModal('${dateStr}', ${bIdx})">Изменить</button>
                                        <button class="btn-danger" onclick="deleteBooking('${dateStr}', ${bIdx})">Удалить</button>
                                    </div>
                                </div>
                            `;
                        }
                    });

                    bodyHtml += `</div>`;
                }
            });
            bodyHtml += `</div>`;
        });
        bodyEl.innerHTML = bodyHtml;
    }

    function changeWeek(dir) {
        currentWeekDate.setDate(currentWeekDate.getDate() + (dir * 7));
        renderBumpixWeekCalendar();
    }

    function goToToday() {
        currentWeekDate = new Date();
        renderBumpixWeekCalendar();
    }

    function updateServicesCheckboxes(selectedNames = []) {
        const container = document.getElementById('servicesCheckboxesContainer');
        container.innerHTML = '';

        categories.forEach(cat => {
            let catServices = services.filter(s => s.group === cat);
            if (catServices.length === 0) return;

            let catBlock = document.createElement('div');
            catBlock.className = 'service-category-block';
            catBlock.innerHTML = `<div class="service-category-title">${cat}</div>`;
            
            let itemsBox = document.createElement('div');
            itemsBox.className = 'service-items-box';

            catServices.forEach(s => {
                let isChecked = selectedNames.includes(s.name);
                let label = document.createElement('label');
                label.style.display = 'flex';
                label.style.alignItems = 'center';
                label.style.gap = '10px';
                label.style.fontSize = '12px';
                label.style.marginBottom = '6px';
                label.style.cursor = 'pointer';
                label.style.color = 'var(--text-main)';
                label.style.textTransform = 'none';
                label.innerHTML = `
                    <input type="checkbox" name="bookingService" value="${s.name}" data-price="${s.price}" data-duration="${s.durationNum || 2}" ${isChecked ? 'checked' : ''} onchange="calculateEndTime()" style="width: auto; cursor: pointer;">
                    <span>${s.name} — ${s.price.toLocaleString()} ₽ (${s.duration})</span>
                `;
                itemsBox.appendChild(label);
            });

            catBlock.appendChild(itemsBox);
            container.appendChild(catBlock);
        });

        calculateEndTime();
    }

    function calculateEndTime() {
        const timeSelect = document.getElementById('formTime');
        if (timeSelect.value === '13:00') {
            alert('Время с 13:00 до 14:00 является обеденным и недоступно для записи.');
            timeSelect.value = '14:00';
        }

        const checkboxes = document.querySelectorAll('input[name="bookingService"]:checked');
        let totalDuration = 0;
        let totalPrice = 0;

        checkboxes.forEach(cb => {
            totalDuration += parseFloat(cb.getAttribute('data-duration')) || 0;
            totalPrice += parseFloat(cb.getAttribute('data-price')) || 0;
        });
        if (totalDuration === 0) totalDuration = 2;

        let [h, m] = timeSelect.value.split(':').map(Number);
        let endM = h * 60 + m + totalDuration * 60;
        
        // Проверяем, не выходит ли запись за рамки рабочего дня (18:00)
        if (endM > 18 * 60) {
            alert('Внимание: выбранная длительность услуги превышает время окончания работы студии (18:00).');
        }

        let endHStr = `${String(Math.floor(endM / 60)).padStart(2, '0')}:${String(endM % 60).padStart(2, '0')}`;

        document.getElementById('timeRangeDisplay').textContent = `${timeSelect.value} — ${endHStr} (${totalDuration} ч.)`;
        document.getElementById('totalPriceDisplay').textContent = `${totalPrice.toLocaleString()} ₽`;
    }

    function onSlotClick(dateStr, timeStr) {
        if (timeStr === '13:00') {
            alert('С 13:00 до 14:00 у мастера обед. Запись в это время невозможна.');
            return;
        }
        document.getElementById('modalTitle').innerText = 'Новая запись';
        document.getElementById('bookingForm').reset();
        document.getElementById('targetDate').value = dateStr;
        document.getElementById('formDate').value = dateStr;
        document.getElementById('formTime').value = timeStr;
        document.getElementById('editIndex').value = '';
        updateServicesCheckboxes([]);
        openModal('bookingModal');
    }

    function openEditModal(dateStr, index) {
        document.getElementById('modalTitle').innerText = 'Редактировать запись';
        const b = bookings[dateStr][index];

        document.getElementById('targetDate').value = dateStr;
        document.getElementById('formDate').value = dateStr;
        document.getElementById('editIndex').value = index;
        document.getElementById('formTime').value = b.time;
        document.getElementById('formName').value = b.name;
        document.getElementById('formPhone').value = b.phone;
        document.getElementById('formCar').value = b.car;

        updateServicesCheckboxes(b.services || [b.service]);
        openModal('bookingModal');
    }

    function openModal(id) {
        document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }

    document.getElementById('bookingForm').addEventListener('submit', function(e) {
        e.preventDefault();
        let timeStr = document.getElementById('formTime').value;
        if (timeStr === '13:00') {
            alert('Ошибка: нельзя записать клиента на обеденное время (13:00 — 14:00).');
            return;
        }

        const checkboxes = document.querySelectorAll('input[name="bookingService"]:checked');
        if (checkboxes.length === 0) {
            alert('Выберите хотя бы одну услугу.');
            return;
        }

        let sNames = [];
        let totalDuration = 0;
        checkboxes.forEach(cb => {
            sNames.push(cb.value);
            totalDuration += parseFloat(cb.getAttribute('data-duration')) || 2;
        });

        let dateStr = document.getElementById('formDate').value;
        let [h, m] = timeStr.split(':').map(Number);
        let endM = h * 60 + m + totalDuration * 60;
        let endHStr = `${String(Math.floor(endM / 60)).padStart(2, '0')}:${String(endM % 60).padStart(2, '0')}`;

        const entry = {
            time: timeStr,
            timeRange: `${timeStr} — ${endHStr}`,
            durationNum: totalDuration,
            services: sNames,
            name: document.getElementById('formName').value,
            phone: document.getElementById('formPhone').value,
            car: document.getElementById('formCar').value
        };

        let editIdx = document.getElementById('editIndex').value;
        let oldDate = document.getElementById('targetDate').value;

        if (editIdx !== '') {
            bookings[oldDate].splice(editIdx, 1);
        }

        if (!bookings[dateStr]) bookings[dateStr] = [];
        bookings[dateStr].push(entry);

        localStorage.setItem('wrap_week_bumpix_bookings', JSON.stringify(bookings));
        closeModal('bookingModal');
        renderBumpixWeekCalendar();
    });

    function deleteBooking(dateStr, idx) {
        if (confirm('Удалить запись?')) {
            bookings[dateStr].splice(idx, 1);
            if (bookings[dateStr].length === 0) delete bookings[dateStr];
            localStorage.setItem('wrap_week_bumpix_bookings', JSON.stringify(bookings));
            renderBumpixWeekCalendar();
        }
    }

    function openServicesModal() {
        renderBumpixCategories();
        openModal('servicesModal');
    }

    function renderBumpixCategories() {
        const container = document.getElementById('bumpixCategoriesList');
        container.innerHTML = '';
        
        categories.forEach(cat => {
            let catServices = services.filter(s => s.group === cat);
            let catBlock = document.createElement('div');
            catBlock.className = 'service-category-block';
            catBlock.innerHTML = `<div class="service-category-title">${cat}</div>`;
            
            let itemsBox = document.createElement('div');
            itemsBox.className = 'service-items-box';

            if (catServices.length === 0) {
                itemsBox.innerHTML = `<div style="padding: 6px 0; font-size:12px; color:var(--text-muted);">Нет услуг</div>`;
            } else {
                catServices.forEach((s) => {
                    let globalIdx = services.indexOf(s);
                    itemsBox.innerHTML += `
                        <div class="bumpix-service-item">
                            <div><strong style="color:var(--text-main);">${s.name}</strong><br><span style="font-size:11px; color:var(--text-muted);">${s.price.toLocaleString()} ₽ • ${s.duration}</span></div>
                            <div><button class="btn-danger" onclick="deleteService(${globalIdx})">Удалить</button></div>
                        </div>
                    `;
                });
            }

            catBlock.appendChild(itemsBox);
            container.appendChild(catBlock);
        });
    }

    function openAddServiceForm() {
        document.getElementById('addServiceForm').reset();
        openModal('serviceEditorModal');
    }

    function syncDurationText() {
        let val = document.getElementById('newServiceDurationNum').value;
        document.getElementById('newServiceDuration').value = `${val} часа`;
    }

    document.getElementById('addServiceForm').addEventListener('submit', function(e) {
        e.preventDefault();
        let dur = parseFloat(document.getElementById('newServiceDurationNum').value) || 2;
        services.push({
            group: document.getElementById('newServiceGroup').value,
            name: document.getElementById('newServiceName').value,
            price: Number(document.getElementById('newServicePrice').value),
            durationNum: dur,
            duration: `${dur} часа`
        });
        localStorage.setItem('wrap_services', JSON.stringify(services));
        closeModal('serviceEditorModal');
        renderBumpixCategories();
    });

    function deleteService(idx) {
        services.splice(idx, 1);
        localStorage.setItem('wrap_services', JSON.stringify(services));
        renderBumpixCategories();
    }

    renderBumpixWeekCalendar();
</script>

</body>
</html>
